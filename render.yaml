services:
  - type: web
    name: facebook-3-unisex-salon
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
